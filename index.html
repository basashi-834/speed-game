<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スピード</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>

<body>

    <h1>トランプ　スピード</h1>

    <div id="level-select">
        <button>easy</button>
        <button>normal</button>
        <button>hard</button>
    </div>

    <main>

        <section id="cpu-area">
            <h2>CPU</h2>
            <div id="cpu-hand"></div>
            <div id="cpu-deck"></div>
        </section>

        <section id="field-area">
            <h2>FIELD</h2>
            <div class="field-table">
                <div id="field-1"></div>
                <div id="field-2"></div>
            </div>
        </section>

        <section>
            <div id="message"></div>
        </section>

        <section id="player-area">
            <h2>YOU</h2>
            <div id="player-deck"></div>
            <div id="player-hand"></div>
        </section>

    </main>
</body>

</html>
